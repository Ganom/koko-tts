<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koko TTS Voices</title>

    <meta property="og:title" content="Koko TTS Voices">
    <meta property="og:description"
          content="Preview all of the voices that are available to be used during Kokonut's live streams!">
    <meta property="og:image" id="og-image" content="https://kokosnutshack.com/icons/embed_icon.webp">
    <meta property="og:url" content="https://kokosnutshack.com/">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#fda9c1"/>


    <style>
        @import url('https://fonts.cdnfonts.com/css/expressway');

        html {
            font-size: 24px;
        }

        body {
            font-family: 'Expressway', Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 30px;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        h1 {
            color: #ffffff;
            text-align: center;
            font-size: 2.5rem;
        }

        .info-box {
            background-color: #2c2c2c;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 60px;
            border: 2px solid #fda9c1;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        .info-box h2 {
            color: #fda9c1;
            margin-top: 0;
        }

        .info-box p {
            margin-bottom: 10px;
        }

        .info-method {
            display: inline-block;
            background-color: #333;
            padding: 8px 15px;
            border-radius: 10px;
            margin: 5px;
        }

        .voice-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(375px, 1fr));
            gap: 45px;
            padding: 30px;
        }

        .voice-item {
            position: relative;
            background-color: #2c2c2c;
            border-radius: 18px;
            padding: 30px;
            padding-top: 75px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .voice-icon {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) translateY(-50%);
            width: 160px;
            height: auto;
            object-fit: contain;
        }

        .voice-item h2 {
            margin: 0 0 22px 0;
            color: #fda9c1;
            text-align: center;
            font-size: 1.5rem;
        }

        .play-button {
            display: block;
            width: 60px;
            height: 60px;
            margin: 0 auto 22px;
            background-color: #fda9c1;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
        }

        .play-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-40%, -50%);
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid #ffffff;
        }

        .play-button.playing::before {
            transform: translate(-50%, -50%);
            border: none;
            width: 20px;
            height: 20px;
            background-color: #ffffff;
        }

        .play-button:hover {
            background-color: #fda9c1;
        }
    </style>
</head>
<body>
<h1>Koko TTS Voices</h1>

<div class="info-box">
    <h2>How to Use TTS During Streams</h2>
    <p>There are two ways to make the bot read your messages with these voices:</p>
    <div class="info-method"><strong>Cheer:</strong> Type "Cheer200 [voicename] your message"</div>
    <div class="info-method"><strong>Channel Points:</strong> Redeem a highlighted message and start with "[voicename] your message"</div>
</div>

<div id="voice-list" class="voice-list"></div>

<script>
    const voices = {
        "2b": "this is the voice, 2b, and koko is a shitbitch",
        "Aussie": "this is the voice, aussie, and koko is a shitbitch",
        "Ben": "this is the voice, ben, and koko is a shitbitch",
        "Chief": "this is the voice, chief, and koko is a shitbitch",
        "Cowboy": "this is the voice, cowboy, and koko's cornbread aint done in the middle",
        "Dagoth": "this is the voice, dagoth, and koko is a shitbitch",
        "Dandy": "this is the voice, dandy, and koko is... i don't know... i'm running out of ideas",
        "Demon": "this is the voice, demon, and gloria a las plagas!",
        "Doc": "this is the voice, doc, and koko is for sure a shitbitch",
        "Dracula": "this is the voice, dracula, and koko is mayhaps a shitbitch",
        "Drum": "this is the voice, Drum, and koko is a shitbitch",
        "Fred": "this is the voice, fred, and koko is a shitbitch. haha!",
        "Ganom": "this is the voice, ganom, and koko held me at gunpoint until I provided this voice",
        "Goblin": "this is the voice, goblin, and koko is not a shitbitch",
        "Grump": "*sigh* this is the voice, grump, and... man what am I even doing here, i just worked a 16 hour shift and now I gotta read some shitty copypasta?",
        "Herbi": "this is the voice, herbi, and koko is... huh? what? oh sorry, i fell asleep",
        "Kawaii": "this is the voice, kawaii, and oh god this voice is so annoying",
        "Lutz": "this is the voice, lutz, and I laugh at things that aren't funny... like koko jokes",
        "Mats": "esta es la voz, kuro, y yo soy un artista increíble",
        "Messmer": "this is the voice, messmer, and koko is a shitbitch",
        "Nerd": "this is the voice, Nerd, and koko is a shitbitch",
        "Pirate": "this is the voice, Pirate, and koko is a shitbitch",
        "Ranni": "this is the voice, ranni, and koko is most likely a shitbitch",
        "Sad": "this is the voice, sad, and koko is a shitbitch. waaaa!",
        "Villain": "this is the voice, villain, and holy fucking shit i'm hot... a buhhhh",
    };

    const voiceList = document.getElementById('voice-list');

    for (const [name, text] of Object.entries(voices)) {
        const voiceItem = document.createElement('div');
        voiceItem.className = 'voice-item';
        voiceItem.innerHTML = `
                <img src="icons/${name.toLowerCase()}.webp" alt="${name} icon" class="voice-icon">
                <h2>${name}</h2>
                <button class="play-button" data-voice="${name.toLowerCase()}"></button>
                <p>[${name.toLowerCase()}] ${text}</p>
            `;
        voiceList.appendChild(voiceItem);
    }

    let currentlyPlaying = null;

    async function fileExists(url) {
        try {
            const response = await fetch(url, {method: 'HEAD'});
            return response.ok;
        } catch {
            return false;
        }
    }

    document.querySelectorAll('.play-button').forEach(async button => {
        const audioPath = `audio/${button.dataset.voice}.mp3`;
        const audio = new Audio(audioPath);
        audio.volume = 0.5;

        const exists = await fileExists(audioPath);
        if (!exists) {
            console.error(`Missing audio file: ${audioPath}`);
            button.disabled = true;
            button.style.backgroundColor = '#666';
            button.title = 'Audio file not available';
        }

        button.addEventListener('click', () => {
            if (currentlyPlaying && currentlyPlaying !== audio) {
                currentlyPlaying.pause();
                currentlyPlaying.currentTime = 0;
                document.querySelector(`.play-button[data-voice="${currentlyPlaying.src.split('/').pop().split('.')[0]}"]`).classList.remove('playing');
            }

            if (audio.paused) {
                audio.play().catch(error => {
                    console.error(`Error playing ${audioPath}:`, error);
                });
                button.classList.add('playing');
                currentlyPlaying = audio;
            } else {
                audio.pause();
                audio.currentTime = 0;
                button.classList.remove('playing');
                currentlyPlaying = null;
            }
        });

        audio.addEventListener('ended', () => {
            button.classList.remove('playing');
            currentlyPlaying = null;
        });

        audio.addEventListener('error', (e) => {
            console.error(`Error loading audio file ${audioPath}:`, e.target.error);
            button.disabled = true;
            button.style.backgroundColor = '#666';
            button.title = 'Error loading audio file';
        });
    });
</script>
</body>
</html>
