<!doctype html>
<html lang="en" data-theme="pink-gold">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koko TTS Voices</title>

    <meta property="og:title" content="Koko TTS Voices" />
    <meta
      property="og:description"
      content="Preview all of the voices that are available to be used during Kokonut's live streams!"
    />
    <meta
      property="og:image"
      content="https://kokosnutshack.com/icons/brian.webp"
    />
    <meta property="og:url" content="https://kokosnutshack.com/" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#fda9c1" />

    <style>
      html {
        background-color: #080808;
        color-scheme: dark;
      }
      body {
        background-color: #080808;
      }
    </style>
    <script>
      (() => {
        const THEME_KEY = "koko-tts-theme";

        try {
          const stored = localStorage.getItem(THEME_KEY);
          const theme =
            stored === "violet-pink" || stored === "pink-gold"
              ? stored
              : "pink-gold";
          document.documentElement.setAttribute("data-theme", theme);
        } catch {
          document.documentElement.setAttribute("data-theme", "pink-gold");
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
